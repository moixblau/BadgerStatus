services:
  badger-status:
    build: .
    container_name: badger-status
    restart: unless-stopped

    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"

    environment:
      SERIAL_PORT: /dev/ttyACM0
      BAUD_RATE: "115200"
      CRON: "* * * * *"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      VOLUMES: /volume1

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /volume1:/volume1:ro

    pid: host
